<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Stock Check SM</title>
<meta name="apple-mobile-web-app-title" content="Stock Check SM">
<meta name="application-name" content="Stock Check SM">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--muted:#6b7280;--line:#e5e7eb;--pri:#c8102e;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,"Noto Sans SC","Noto Sans Myanmar","Myanmar Text",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
  header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header .t{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
  main{padding:12px 12px 110px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .big-btn{display:flex;align-items:center;gap:12px;width:100%;padding:18px 16px;margin-bottom:10px;border:0;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:18px;font-weight:600;text-align:left;color:var(--ink)}
  .big-btn .ic{font-size:28px;width:36px;text-align:center}
  .big-btn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
  label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
  select,input,textarea{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:200px;font-family:inherit}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;font-size:17px;font-weight:700;background:var(--pri);color:#fff;margin-top:12px}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:14px;color:var(--ink)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .item.sel{border-color:var(--pri);box-shadow:0 0 0 2px rgba(200,16,46,.12)}
  .nm{font-weight:600;font-size:16px;line-height:1.25}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .stk{color:var(--muted);font-size:12.5px}
  .row{display:flex;align-items:center;gap:8px;margin-top:8px}
  .row .u{flex:1;font-size:14px;color:var(--muted)}
  .stp{display:flex;align-items:center;gap:0}
  .stp button{width:46px;height:42px;border:1px solid var(--line);background:#f3f4f6;font-size:22px;font-weight:700;color:var(--ink)}
  .stp button:first-child{border-radius:10px 0 0 10px}.stp button:last-child{border-radius:0 10px 10px 0}
  .stp span{min-width:48px;height:42px;line-height:42px;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:18px;font-weight:700;background:#fff}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
  .bar .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
  .bar .btn{margin:0;flex:1}
  .bar .cnt{font-size:14px;color:var(--muted);min-width:70px}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff}
  .ok{background:var(--ok)}.unsure{background:var(--warn)}.none{background:var(--bad)}
  .line{border-left:5px solid var(--line)}
  .line.s-ok{border-left-color:var(--ok)}.line.s-unsure{border-left-color:var(--warn)}.line.s-none{border-left-color:var(--bad)}
  .raw{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#f3f4f6;border-radius:6px;padding:4px 8px;margin-bottom:6px;word-break:break-all}
  .x{float:right;border:0;background:none;color:var(--muted);font-size:20px}
  .msg{padding:12px;border-radius:10px;margin-bottom:10px}
  .msg.e{background:#fee2e2;color:#7f1d1d}.msg.s{background:#dcfce7;color:#14532d}
  .hide{display:none!important}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 12px;font-size:14px;color:var(--ink);text-align:left}
  .chip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
  .chip.other{background:#eef2ff;border-color:#c7d2fe;color:#1e3a8a}
  .seg{display:flex;gap:8px;margin-bottom:10px}
  .seg button{flex:1;padding:14px 8px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:700;color:var(--ink)}
  .seg button.on{border-color:var(--pri);background:#fff1f2;color:var(--pri)}
  #pk{position:fixed;inset:0;background:var(--bg);z-index:15;display:flex;flex-direction:column}
  #pk .ph{background:var(--ink);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
  #pk .ph button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 12px;font-size:15px}
  #pk .pb{padding:10px 12px;overflow-y:auto;flex:1}
  .prow{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:6px;color:var(--ink)}
  .center{text-align:center}
  .spin{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:20;font-weight:700}
  .lang button{padding:6px 8px}
  .lang button.on{background:#fff;color:var(--pri)}
  img.prev{max-width:100%;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<header>
  <button id="backBtn" class="hide" onclick="go('home')">‹</button>
  <div class="t" id="title">Yonny SM</div>
  <span class="lang"><button data-l="en">EN</button><button data-l="zh">中</button><button data-l="my">မြန်</button></span>
</header>
<main id="main"></main>
<div class="bar hide" id="bar"><div class="in"><div class="cnt" id="barCnt"></div><button class="btn" id="barBtn"></button></div></div>
<div class="spin hide" id="spin">…</div>
<div id="pk" class="hide"></div>

const UNIT_EN = {'大包':'big pack','小包':'small pack','大袋':'big bag','捆':'bundle'};
const UNIT_MY = {'箱':'သေတ္တာ','包':'ထုပ်','大包':'ထုပ်ကြီး','小包':'ထုပ်သေး','大袋':'အိတ်ကြီး','捆':'စည်း','桶':'ပုံး','瓶':'ပုလင်း','盒':'ဘူး','罐':'ဘူး','个':'ခု','套':'အစုံ'};
function u(s){ const p=String(s||'').split(' '), code=p[0]||'', cn=p[1]||code;
  if(L==='zh') return cn; if(L==='my') return UNIT_MY[cn]||cn; return UNIT_EN[cn]||code; }
function fmtStock(it,base){
  if(base==null) return ''; base=Math.round(base*100)/100;
  if(!it.per) return base+' '+u(it.big);
  const neg=base<0, b=Math.abs(base), bg=Math.floor(b/it.per), sm=Math.round((b-bg*it.per)*100)/100, parts=[];
  if(bg) parts.push(bg+' '+u(it.big)); if(sm||!bg) parts.push(sm+' '+u(it.small));
  return (neg?'-':'')+parts.join(' + ');
}

function catLabel(c){ const p=c.split(' '); if(L==='zh') return p[0]; if(L==='my') return CAT_MY[p[0]]||p[0]; return p.slice(1).join(' ')||c; }

// ---------------- document scanner (auto edges via OpenCV.js, manual 4-corner fallback) ----------------
let CV_P = null;
function loadCV(){
  if(window.cv && window.cv.Mat) return Promise.resolve(true);   // never resolve with cv itself: it is 'thenable' and would loop
  if(CV_P) return CV_P;
  CV_P = new Promise((res,rej)=>{
    const done = c=>{ if(c && c.Mat){ window.cv=c; clearTimeout(to); res(true); } };
    const to = setTimeout(()=>rej('timeout'), 60000);
    const s = document.createElement('script'); s.src = 'opencv.js'; s.async = true;
    s.onload = ()=>{ const c = window.cv; if(!c) return rej('nocv');
      if(c.Mat) return done(c);
      if(typeof c.then==='function'){ try{ c.then(m=>done(m)); }catch(e){} }
      const prev = c.onRuntimeInitialized; c.onRuntimeInitialized = ()=>{ if(prev) try{prev();}catch(e){} done(c); };
      const poll = setInterval(()=>{ if(window.cv && window.cv.Mat){ clearInterval(poll); done(window.cv); } }, 300);
    };
    s.onerror = ()=>{ clearTimeout(to); rej('load'); };
    document.head.appendChild(s);
  }).catch(e=>{ CV_P=null; throw e; });
  return CV_P;
}
function orderQuad(p){
  const s=p.map(q=>q.x+q.y), d=p.map(q=>q.x-q.y);
  return [ p[s.indexOf(Math.min(...s))], p[d.indexOf(Math.max(...d))], p[s.indexOf(Math.max(...s))], p[d.indexOf(Math.min(...d))] ]; // tl,tr,br,bl
}
function defaultQuad(w,h){ return [{x:0,y:0},{x:w,y:0},{x:w,y:h},{x:0,y:h}]; }   // whole photo = no crop
function quadOk(q,W,H){   // sensible paper shape: big enough, corners near 90°, opposite sides similar
  const area=qq=>{ let a=0; for(let i=0;i<4;i++){ const p=qq[i], n=qq[(i+1)%4]; a+=p.x*n.y-n.x*p.y; } return Math.abs(a)/2; };
  if(area(q)<W*H*0.2) return false;
  for(let i=0;i<4;i++){ const p=q[(i+3)%4], c=q[i], n=q[(i+1)%4];
    const v1={x:p.x-c.x,y:p.y-c.y}, v2={x:n.x-c.x,y:n.y-c.y};
    const ang=Math.acos((v1.x*v2.x+v1.y*v2.y)/(Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y)+1e-9))*180/Math.PI;
    if(ang<60||ang>120) return false; }
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), r1=d(q[0],q[1])/d(q[3],q[2]), r2=d(q[0],q[3])/d(q[1],q[2]);
  return r1>0.6&&r1<1/0.6&&r2>0.6&&r2<1/0.6;
}
// Rebuild 4 corners from the paper's straight sides (works when a corner is in shadow or cut by the threshold):
// each side = the longest hull edge running along that side of the bounding box; corners = where sides meet.
function sideQuad(cv,hull){
  const P=[]; for(let i=0;i<hull.rows;i++) P.push({x:hull.data32S[i*2],y:hull.data32S[i*2+1]});
  if(P.length<4) return null;
  const R=orderQuad(cv.RotatedRect.points(cv.minAreaRect(hull)).map(o=>({x:o.x,y:o.y})));
  const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x), best=[null,null,null,null];
  for(let i=0;i<P.length;i++){ const p=P[i], q=P[(i+1)%P.length], L=Math.hypot(q.x-p.x,q.y-p.y); if(L<8) continue;
    const m={x:(p.x+q.x)/2,y:(p.y+q.y)/2}; let bs=-1, bd=1e9;
    for(let s=0;s<4;s++){ const a=R[s], b=R[(s+1)%4];
      let d=Math.abs(ang(p,q)-ang(a,b))%Math.PI; d=Math.min(d,Math.PI-d); if(d>20*Math.PI/180) continue;
      const len=Math.hypot(b.x-a.x,b.y-a.y), dist=Math.abs((b.x-a.x)*(a.y-m.y)-(a.x-m.x)*(b.y-a.y))/len;
      if(dist<bd){ bd=dist; bs=s; } }
    if(bs>=0 && (!best[bs] || L>best[bs].L)) best[bs]={p,q,L}; }
  if(best.some(b=>!b)) return null;
  const X=(e1,e2)=>{ const a1=e1.q.y-e1.p.y, b1=e1.p.x-e1.q.x, c1=a1*e1.p.x+b1*e1.p.y, a2=e2.q.y-e2.p.y, b2=e2.p.x-e2.q.x, c2=a2*e2.p.x+b2*e2.p.y, D=a1*b2-a2*b1;
    return Math.abs(D)<1e-6?null:{x:(c1*b2-c2*b1)/D,y:(a1*c2-a2*c1)/D}; };
  const q=[X(best[3],best[0]),X(best[0],best[1]),X(best[1],best[2]),X(best[2],best[3])];
  return q.some(v=>!v)?null:q;
}
// Returns 4 corners ONLY when a clear paper outline is found. Otherwise null → the whole photo is kept

function detectQuad(src){

function homography(q,w,h){
  const src=[[0,0],[w,0],[w,h],[0,h]], A=[], b=[];
  for(let i=0;i<4;i++){ const [x,y]=src[i], X=q[i].x, Y=q[i].y;
    A.push([x,y,1,0,0,0,-x*X,-y*X]); b.push(X); A.push([0,0,0,x,y,1,-x*Y,-y*Y]); b.push(Y); }
  for(let c=0;c<8;c++){ let p=c; for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    [A[c],A[p]]=[A[p],A[c]]; [b[c],b[p]]=[b[p],b[c]];
    for(let r=0;r<8;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<8;k++) A[r][k]-=f*A[c][k]; b[r]-=f*b[c]; } }

// straighten a slightly tilted page using the printed table / text lines (only small angles, ≤12°)
function deskewAngle(c){

  const sc=Math.min(1,1000/Math.max(c.width,c.height)), sm=document.createElement('canvas');
  sm.width=Math.round(c.width*sc); sm.height=Math.round(c.height*sc); sm.getContext('2d').drawImage(c,0,0,sm.width,sm.height);

  try{
    cv.cvtColor(m,g,cv.COLOR_RGBA2GRAY); cv.Canny(g,e,50,150);

    cv.HoughLinesP(e,L,1,Math.PI/360,80,minLen,8);

  $('barBtn').textContent='⬆️ '+t('upload'); $('barBtn').disabled=!u_.photos.length;
  $('barBtn').onclick=()=>{ if(!S.up.photos.length) return; busy(true);
    call('uploadDocOnly',{pin:S.pin,staff:S.staff,photos:S.up.photos,supplier:S.up.supplier,docType:S.up.docType,docNo:S.up.docNo})
      .then(r=>{ busy(false); S.lastN=r.n; S.up=null; go('done'); }).catch(fail); };
}
async function addUpPhotos(inp){
  const files=[...(inp.files||[])].slice(0,6-S.up.photos.length); inp.value=''; if(!files.length) return;
  for(const f of files){
    if(f.type==='application/pdf'){ if(f.size>8e6){ alert(t('pdfBig')); continue; }
      S.up.photos.push(await new Promise(r=>{ const fr=new FileReader(); fr.onload=e=>r(e.target.result); fr.readAsDataURL(f); })); }
    else { const out=await scanFiles([f]); S.up.photos.push(...out); }
  }
  vUpload();
}
function addDoPhotos(inp){
  const files=[...(inp.files||[])].filter(f=>f.type.indexOf('image')===0).slice(0,4-(S.doPhotos||[]).length); inp.value=''; if(!files.length) return;
  scanFiles(files).then(arr=>{ S.doPhotos.push(...arr); vDeliv(); });
}
function readDoc(){
  if(!S.doPhotos.length) return;
  busy(true); $('spin').textContent=t('reading');
  call('readDO',{pin:S.pin,photos:S.doPhotos}).then(r=>{ busy(false); $('spin').textContent='…';
    S.doc=r; S.checkMode='DO'; S.lines=r.lines; go('check'); })
  .catch(e=>{ $('spin').textContent='…'; fail(e); });
}
function openDel(i){ S.del=JSON.parse(JSON.stringify(S.dels[i])); S.photo=''; go('recv'); }
function vRecv(){
  const d=S.del;
  $('main').innerHTML = `<h3 style="margin:4px 0 2px">${esc(d.sup)}</h3><div class="sub" style="margin-bottom:10px">${esc(d.id)} · ${esc(d.date)}</div>` +
    d.lines.map((l,i)=>{ const it=byId(l.id); return `<div class="item"><div class="nm">${esc(itemName(it))}</div><div class="sub">${esc(itemSub(it))}</div>
      ${it.per?`<div class="row"><div class="u">${esc(u(it.small))}</div><div class="stp"><button onclick="dq(${i},'small',-1)">−</button><span>${l.small}</span><button onclick="dq(${i},'small',1)">+</button></div></div>`:''}
      <div class="row"><div class="u">${esc(u(it.big))}${it.per?` (${it.per} ${esc(u(it.small))})`:''}</div><div class="stp"><button onclick="dq(${i},'big',-1)">−</button><span>${l.big}</span><button onclick="dq(${i},'big',1)">+</button></div></div></div>`; }).join('') +
    `<label>${t('photo')}</label><input type="file" accept="image/*" capture="environment" onchange="pickPhoto(this)"><div id="pv">${S.photo?`<img class="prev" src="${S.photo}">`:''}</div>`;
  $('bar').classList.remove('hide'); $('barCnt').textContent=d.lines.length+' '+t('items');
  $('barBtn').textContent=t('allRecv'); $('barBtn').disabled=false;
  $('barBtn').onclick=()=>{ if(!S.photo) return alert(t('photoReq')); busy(true);
    call('receiveDelivery',{delId:d.id,staff:S.staff,pin:S.pin,lines:d.lines,photo:S.photo}).then(after).catch(fail); };
}
function dq(i,k,dd){ const l=S.del.lines[i]; l[k]=Math.max(0,(l[k]||0)+dd); vRecv(); }
function pickPhoto(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const img=new Image(), r=new FileReader();
  r.onload=e=>{ img.onload=()=>{ const max=1400, sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=img.width*sc; c.height=img.height*sc; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.photo=c.toDataURL('image/jpeg',0.7); $('pv').innerHTML=`<img class="prev" src="${S.photo}">`; }; img.src=e.target.result; };
  r.readAsDataURL(f);
}
</script>
